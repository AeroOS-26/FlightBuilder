# Bitbucket Pipelines — mirror reviewable branches to the client's GitHub repo.
#
# Branch model (agreed with the client, 25 Aug 2026):
#
#   feat/*    working branches. Never mirrored, never seen by the client.
#     ↓ merge when a piece is ready for review
#   develop   review branch. Mirrors to GitHub as `develop`, which is what the
#             client reads and what their Vercel preview builds from.
#     ↓ merge only after the client accepts
#   main      production. Mirrors to GitHub `main`, which deploys the live site.
#
# The point of the split: the client reviews the WORKING branch before
# acceptance rather than the merged result, and `main` becomes a record of what
# has been accepted rather than wherever work happens to have reached.
#
# Action:   publish the current tree as a single commit authored by XpertWebApp,
#           so the client's repo only ever shows XpertWebApp as the contributor.
#           The real (multi-author) Bitbucket history stays private.
#
# Security: authentication uses a GitHub fine-grained personal access token
#           (Contents: read & write on the client's repo only). The token lives
#           ONLY in the secured Bitbucket variable GITHUB_TOKEN and is passed to
#           git via an Authorization header, so it never appears in a URL or the
#           logs. No credentials are hardcoded here. See docs/ci-github-mirror.md.
#
# Authentication vs. attribution:
#           The token decides WHO MAY PUSH. It does NOT set who GitHub shows as
#           the author — that comes from the commit author/committer fields,
#           forced to XpertWebApp below. For commits to link to the XpertWebApp
#           profile/avatar, GIT_AUTHOR_EMAIL must be verified on that account.
#
# Required Bitbucket repository variables:
#   GITHUB_TOKEN        (secured)  Fine-grained PAT, Contents: read & write.
#   GITHUB_REPO_HTTPS              https://github.com/AeroOS-26/FlightBuilder.git
#   GIT_AUTHOR_EMAIL              Email verified on the XpertWebApp GitHub account.
# Optional:
#   GIT_AUTHOR_NAME    default "XpertWebApp"
#
# REMOVED: MIRROR_BRANCH. The target is now always the branch being built, so
#   `develop` publishes to `develop` and `main` publishes to `main`. It used to
#   be a repository variable defaulting to "main", which meant that adding a
#   second trigger would have pushed the review branch straight onto the
#   client's production branch — deploying unreviewed code to the live site.
#   **If that variable still exists in Bitbucket settings, delete it.** The
#   guard below refuses to run while it is set, rather than trusting it is right.

image: atlassian/default-image:4

definitions:
  steps:
    - step: &mirror
        name: Mirror branch to client GitHub
        clone:
          # We publish a snapshot of the tip; full history isn't required.
          depth: 1
        script:
          - |
            set -euo pipefail

            # --- Configuration (no secrets inlined) ---
            AUTHOR_NAME="${GIT_AUTHOR_NAME:-XpertWebApp}"
            : "${GITHUB_TOKEN:?GITHUB_TOKEN repository variable is required}"
            : "${GITHUB_REPO_HTTPS:?GITHUB_REPO_HTTPS repository variable is required}"
            : "${GIT_AUTHOR_EMAIL:?GIT_AUTHOR_EMAIL repository variable is required (verified on the XpertWebApp GitHub account)}"

            # --- The target is the branch being built. Never configurable. ---
            # A stale MIRROR_BRANCH variable would silently redirect a review
            # branch onto production, so refuse to run instead of guessing.
            if [ -n "${MIRROR_BRANCH:-}" ]; then
              echo "ERROR: MIRROR_BRANCH is set to '${MIRROR_BRANCH}'." >&2
              echo "It is no longer used and is unsafe — delete it from the" >&2
              echo "Bitbucket repository variables. The mirror target is now" >&2
              echo "always the branch being built." >&2
              exit 1
            fi
            MIRROR_BRANCH="$BITBUCKET_BRANCH"

            # Only these branches may ever reach the client's repository.
            case "$MIRROR_BRANCH" in
              main|develop) ;;
              *) echo "Refusing to mirror '$MIRROR_BRANCH' — not a published branch." >&2; exit 1 ;;
            esac

            SRC_REF="$(git rev-parse --short HEAD)"
            echo "Mirroring ${MIRROR_BRANCH} @ ${SRC_REF} → GitHub ${MIRROR_BRANCH}"

            # --- Token auth via Authorization header (keeps token out of URLs/logs) ---
            AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
            git_auth() { git -c "http.extraheader=Authorization: Basic ${AUTH_B64}" "$@"; }

            # --- Snapshot the source tree (source only, no .git history) ---
            SRC_TREE="$(mktemp -d)"
            git archive --format=tar HEAD | (cd "$SRC_TREE" && tar -xf -)

            # --- Clone the GitHub mirror so we APPEND to its history (no force-push) ---
            MIRROR_DIR="$(mktemp -d)"
            if git_auth clone --branch "$MIRROR_BRANCH" --depth 1 "$GITHUB_REPO_HTTPS" "$MIRROR_DIR" 2>/dev/null; then
              echo "Cloned existing GitHub branch '$MIRROR_BRANCH'."
              EXISTING=1
            else
              echo "Branch '$MIRROR_BRANCH' not found on GitHub — initializing it."
              if git_auth clone --depth 1 "$GITHUB_REPO_HTTPS" "$MIRROR_DIR" 2>/dev/null; then :; else
                git init -q "$MIRROR_DIR"
                git -C "$MIRROR_DIR" remote add origin "$GITHUB_REPO_HTTPS"
              fi
              EXISTING=0
            fi

            cd "$MIRROR_DIR"
            git config user.name "$AUTHOR_NAME"
            git config user.email "$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_NAME="$AUTHOR_NAME" GIT_COMMITTER_NAME="$AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            # GIT_AUTHOR_EMAIL is already in the environment from the repo variable.

            if [ "$EXISTING" -eq 0 ]; then
              # Branching from the default branch's tip keeps `main...develop`
              # a readable diff on GitHub rather than two unrelated histories.
              git checkout -q -b "$MIRROR_BRANCH" 2>/dev/null || git checkout -q "$MIRROR_BRANCH"
            fi

            # Replace the tree with the new snapshot so deletions propagate too.
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            cp -a "$SRC_TREE"/. .
            git add -A

            if git diff --cached --quiet; then
              echo "No changes since last sync — nothing to push."
              exit 0
            fi

            git commit -q -m "Sync Flight Builder (${MIRROR_BRANCH} @ ${SRC_REF})"
            git_auth push origin "HEAD:${MIRROR_BRANCH}"
            echo "Mirror complete: published ${MIRROR_BRANCH} @ ${SRC_REF} to GitHub as ${AUTHOR_NAME}."

pipelines:
  branches:
    # Review branch — what the client reads and previews before acceptance.
    develop:
      - step: *mirror

    # Production — only merged here after the client has accepted.
    main:
      - step: *mirror
